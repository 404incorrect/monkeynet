  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;

  :root{--bg:#12160F;--panel:#1B231D;--panel2:#252E27;--ink:#F5F2E9;--muted:#AFC1B4;

    border-radius:10px;padding:10px;font-size:14px;font-family:inherit}

  /* ---- view switcher ---- */

  /* ---- timestamps ---- */

  /* ---- grid (masonry) view ---- */
  #feed.masonry{column-width:190px;column-gap:14px}
  .tile{break-inside:avoid;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;cursor:zoom-in;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--banana);transform:translateY(-2px)}
  .tile img{width:100%;display:block;background:#000}
  .tile .tmeta{padding:9px 11px}

  /* ---- scatter (move-it-around) view ---- */
  .board{position:relative;width:100%;height:74vh;min-height:460px;overflow:hidden;

  .boardhint{position:absolute;top:10px;left:13px;color:var(--muted);font-size:11px;

  .mk img{width:100%;display:block;border:3px solid #fff;border-radius:7px;background:#000;
    pointer-events:none}
  @media(max-width:520px){ .mk{width:98px} .board{height:70vh} }

  /* ---- lightbox (grid/scatter tap-to-open) ---- */
  .lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;

  .lbin{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--panel);

    display:flex;align-items:center;gap:8px}
  .lbwho .anon{color:var(--muted);font-weight:600}
  .lbwho .t{margin-left:auto;color:var(--muted);font-weight:600;flex:none}

<script>
/* ============ CONFIG ============
   Paste these from your Supabase project (Settings → API) to go public + free.
   Leave blank to run in local demo mode (this browser only). */
const SUPABASE_URL  = 'https://ucopubxejatgjgqmqnlu.supabase.co';
const SUPABASE_ANON = 'sb_publishable_P1clPSQ1JhkD2_yLtCpXFQ_BYN0Hhc6';   // the public "publishable" key (safe to expose; RLS protects your data)
const BUCKET = 'monkeys';
/* Moderation is done in the Supabase dashboard: Table editor → set a monkey's `hidden`
   column to true (or delete the row). There is deliberately no admin control on this page. */
/* ================================ */

const useSupa = !!(SUPABASE_URL && SUPABASE_ANON);
const HAS_LOCAL = (typeof window!=='undefined') && !!window.storage;

/* ---- backend abstraction: works with {handle, caption, src, ts} ---- */
const Store = {
  async list(){
    if(useSupa){
      const r=await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&hidden=eq.false&order=created_at.desc&limit=200`,
        {headers:{apikey:SUPABASE_ANON, Authorization:'Bearer '+SUPABASE_ANON}});
      if(!r.ok) throw new Error('list failed'); const rows=await r.json();
      return rows.map(p=>({id:p.id, handle:p.handle||'', caption:p.caption||'', src:p.image_url, ts:new Date(p.created_at).getTime()}));
    }
    if(HAS_LOCAL){ const out=[];
      try{ const res=await window.storage.list('gallery:item:', true);
        if(res&&res.keys) for(const k of res.keys){ try{ const g=await window.storage.get(k,true);
          if(g){ const it=JSON.parse(g.value); if(it.hidden) continue;
            out.push({id:k, handle:it.handle||'', caption:it.caption, src:it.img, ts:it.ts}); } }catch(e){} } }catch(e){}
      return out.sort((a,b)=>b.ts-a.ts);
    }
    return [];
  },
  async add(handle, caption, canvas){
    if(useSupa){
      const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.82));
      const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
      const up=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,
        {method:'POST', headers:{apikey:SUPABASE_ANON, Authorization:'Bearer '+SUPABASE_ANON,
          'Content-Type':'image/jpeg'}, body:blob});
      if(!up.ok) throw new Error('upload failed');
      const image_url=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
      const ins=await fetch(`${SUPABASE_URL}/rest/v1/posts`,
        {method:'POST', headers:{apikey:SUPABASE_ANON, Authorization:'Bearer '+SUPABASE_ANON,
          'Content-Type':'application/json', Prefer:'return=minimal'},
          body:JSON.stringify({handle, caption, image_url})});
      if(!ins.ok) throw new Error('insert failed');
      return;
    }
    if(HAS_LOCAL){
      const img=canvas.toDataURL('image/jpeg',0.72);
      const id='w'+Date.now()+Math.floor(Math.random()*1000);
      await window.storage.set('gallery:item:'+id, JSON.stringify({handle,caption,img,ts:Date.now()}), true);
      return;
    }
    throw new Error('no backend');
  }
};

/* ---- demo-mode banner (shown only when Supabase isn't configured) ---- */
const banner=document.getElementById('banner');
if(!useSupa){
  banner.style.display='block';
  banner.innerHTML='<b>Local demo mode.</b> Monkeys are hung in this browser only so you can try it. '
    +'Add your Supabase URL + anon key in the CONFIG block to make it a real shared gallery (free).'; }

/* ---- compose ---- */
let pickedCanvas=null;
const drop=document.getElementById('drop'), fileEl=document.getElementById('file'),
      postBtn=document.getElementById('post'), capEl=document.getElementById('cap'),
      handleEl=document.getElementById('handle'), statusEl=document.getElementById('status');

/* load an image source into the composer as the picked monkey */
function loadIntoComposer(src, caption){
  const im=new Image(); im.onload=()=>{
    let w=im.width,h=im.height; const s=Math.min(1,1000/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
    pickedCanvas=c;
    drop.classList.add('has'); drop.innerHTML=''; const prev=new Image(); prev.src=c.toDataURL('image/jpeg',0.85);
    drop.appendChild(prev); drop.appendChild(fileEl);
    postBtn.disabled=false;
    if(caption && !capEl.value) capEl.value=caption;
  }; im.src=src;
}

drop.onclick=()=>fileEl.click();
fileEl.onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>loadIntoComposer(r.result); r.readAsDataURL(f); };

/* ---- handoff: a monkey sent over from MonkeyMaker ----
   NOTE: called at the very end of the script (not here) so the composer is
   fully wired and toast()/toastT are initialized before it can run. */
function pickupFromMaker(){
  let raw; try{ raw=sessionStorage.getItem('mk:handoff'); }catch(e){ return; }
  if(!raw) return;
  try{ sessionStorage.removeItem('mk:handoff'); }catch(e){}
  let data; try{ data=JSON.parse(raw); }catch(e){ return; }
  if(!data || !data.img) return;
  loadIntoComposer(data.img, (data.caption||'').trim());
  if(data.handle && !handleEl.value) handleEl.value=String(data.handle).slice(0,24);
  toast('Monkey loaded 🐵');
}

postBtn.onclick=async()=>{
  if(!pickedCanvas) return;
  postBtn.disabled=true; statusEl.textContent='Hanging…';
  try{ await Store.add(handleEl.value.trim().slice(0,24), capEl.value.trim(), pickedCanvas);
    statusEl.textContent=''; toast('Up in the gallery 🐵');
    pickedCanvas=null; capEl.value=''; handleEl.value='';
    drop.classList.remove('has'); drop.innerHTML='<span id="dropText">Tap to add a monkey 🐵</span>'; drop.appendChild(fileEl);
    loadFeed();
  }catch(e){ statusEl.textContent=''; postBtn.disabled=false; toast('Could not hang it — check your Supabase setup'); }
};

/* ============ the gallery: wall / grid / scatter ============ */
const feedEl=document.getElementById('feed'),
      wrapEl=document.querySelector('.wrap'),
      viewsEl=document.getElementById('views'),
      lb=document.getElementById('lb'), lbImg=document.getElementById('lbimg'),
      lbCap=document.getElementById('lbcap'), lbWho=document.getElementById('lbwho');

let POSTS=[];
let mode='wall';
try{ const m=localStorage.getItem('gallery:view'); if(['wall','grid','scatter'].includes(m)) mode=m; }catch(e){}

/* scatter positions are remembered locally (fractional, so they survive resizes) */
let scatterPos={};
try{ scatterPos=JSON.parse(localStorage.getItem('gallery:scatter')||'{}')||{}; }catch(e){ scatterPos={}; }
function saveScatter(){ try{ localStorage.setItem('gallery:scatter', JSON.stringify(scatterPos)); }catch(e){} }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function timeAgo(ts){ if(!ts) return ''; let s=Math.floor((Date.now()-ts)/1000); if(s<0)s=0;
  if(s<45)return'just now'; if(s<90)return'1m ago';
  const m=Math.floor(s/60); if(m<60)return m+'m ago';
  const h=Math.floor(m/60); if(h<24)return h+'h ago';
  const d=Math.floor(h/24); if(d<7)return d+'d ago';
  const w=Math.floor(d/7); if(w<5)return w+'w ago';
  const mo=Math.floor(d/30); if(mo<12)return mo+'mo ago';
  return Math.floor(d/365)+'y ago'; }
function fullDate(ts){ try{ return new Date(ts).toLocaleString(); }catch(e){ return ''; } }
function whoHTML(p,timeCls){
  return (p.handle?('🐵 '+esc(p.handle)):'<span class="anon">🐵 some monkey</span>')
    + '<span class="'+timeCls+'" title="'+esc(fullDate(p.ts))+'">'+esc(timeAgo(p.ts))+'</span>'; }

/* deterministic layout helpers so the scatter looks intentional, not random each load */
function hashStr(s){ s=String(s); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function seeded(n){ const x=Math.sin(n)*10000; return x-Math.floor(x); }

/* ---- lightbox (used by grid + scatter) ---- */
function openLB(p){ lbImg.src=p.src;
  lbCap.textContent=p.caption||''; lbCap.style.display=p.caption?'block':'none';
  lbWho.innerHTML=whoHTML(p,'t'); lb.classList.add('show'); }
function closeLB(){ lb.classList.remove('show'); }
lb.addEventListener('click', e=>{ if(e.target===lb) closeLB(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });

/* ---- view switcher ---- */
function applyModeUI(){
  [...viewsEl.children].forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  wrapEl.classList.toggle('wide', mode!=='wall'); }
function setMode(m){ if(m===mode) return; mode=m; try{ localStorage.setItem('gallery:view',m); }catch(e){}
  applyModeUI(); render(); }
viewsEl.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.mode); });

function render(){
  feedEl.className=''; feedEl.innerHTML='';
  if(!POSTS.length){ feedEl.innerHTML='<div class="empty">Empty gallery. Hang the first monkey 🍌</div>'; return; }
  if(mode==='grid'){ renderGrid(); return; }
  if(mode==='scatter'){ renderScatter(); return; }
  renderWall();
}

function renderWall(){
  POSTS.forEach(p=>{
    const d=document.createElement('div'); d.className='post';
    const im=document.createElement('img'); im.className='shot'; im.src=p.src; im.loading='lazy'; im.alt='a monkey';
    d.appendChild(im);
    const m=document.createElement('div'); m.className='meta';
    if(p.caption){ const c=document.createElement('div'); c.className='cap'; c.textContent=p.caption; m.appendChild(c); }
    const who=document.createElement('div'); who.className='who'; who.innerHTML=whoHTML(p,'when');
    m.appendChild(who); d.appendChild(m); feedEl.appendChild(d);
  });
}

function renderGrid(){
  feedEl.className='masonry';
  POSTS.forEach(p=>{
    const t=document.createElement('div'); t.className='tile';
    const im=document.createElement('img'); im.src=p.src; im.loading='lazy'; im.alt='a monkey';
    t.appendChild(im);
    const meta=document.createElement('div'); meta.className='tmeta';
    if(p.caption){ const c=document.createElement('div'); c.className='tcap'; c.textContent=p.caption; meta.appendChild(c); }
    const who=document.createElement('div'); who.className='twho'; who.innerHTML=whoHTML(p,'ttime');
    meta.appendChild(who); t.appendChild(meta);
    t.addEventListener('click', ()=>openLB(p));
    feedEl.appendChild(t);
  });
}

function renderScatter(){
  const board=document.createElement('div'); board.className='board';
  const hint=document.createElement('div'); hint.className='boardhint';
  hint.textContent='drag the monkeys around · tap one to open'; board.appendChild(hint);
  feedEl.appendChild(board);
  POSTS.forEach((p,i)=>{
    const key=p.id||('i'+i);
    const el=document.createElement('div'); el.className='mk';
    const im=document.createElement('img'); im.src=p.src; im.alt='a monkey'; im.draggable=false; im.loading='lazy';
    el.appendChild(im);
    const tilt=(seeded(hashStr(key)+7)*16-8).toFixed(2);
    el.style.transform='rotate('+tilt+'deg)';
    board.appendChild(el);
    const pos=scatterPos[key] || { x:0.04+seeded(hashStr(key))*0.72, y:0.05+seeded(hashStr(key)+3)*0.62 };
    placeMk(el, board, pos.x, pos.y);
    dragify(el, board, key, p);
  });
}
function placeMk(el, board, fx, fy){
  const W=board.clientWidth, H=board.clientHeight, w=el.offsetWidth||140, h=el.offsetHeight||140;
  el.style.left=(Math.max(0,Math.min(fx,1-w/W))*W)+'px';
  el.style.top =(Math.max(0,Math.min(fy,1-h/H))*H)+'px';
}
function dragify(el, board, key, p){
  let ox=0, oy=0, sx=0, sy=0, moved=0, dragging=false;
  el.addEventListener('pointerdown', e=>{
    dragging=true; moved=0; sx=e.clientX; sy=e.clientY;
    const br=board.getBoundingClientRect();
    ox=e.clientX-br.left-parseFloat(el.style.left||0);
    oy=e.clientY-br.top -parseFloat(el.style.top ||0);
    el.classList.add('drag'); try{ el.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const br=board.getBoundingClientRect();
    let x=e.clientX-br.left-ox, y=e.clientY-br.top-oy;
    x=Math.max(0,Math.min(x, br.width -el.offsetWidth));
    y=Math.max(0,Math.min(y, br.height-el.offsetHeight));
    el.style.left=x+'px'; el.style.top=y+'px';
    moved+=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy); sx=e.clientX; sy=e.clientY;
  });
  const end=()=>{
    if(!dragging) return; dragging=false; el.classList.remove('drag');
    const br=board.getBoundingClientRect();
    scatterPos[key]={ x:parseFloat(el.style.left)/br.width, y:parseFloat(el.style.top)/br.height };
    saveScatter();
    if(moved<5) openLB(p);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* keep the scatter in-bounds when the window is resized */
let rzT; window.addEventListener('resize', ()=>{ if(mode!=='scatter') return;
  clearTimeout(rzT); rzT=setTimeout(render,160); });

async function loadFeed(){
  try{ POSTS=await Store.list(); }
  catch(e){ feedEl.className=''; feedEl.innerHTML='<div class="empty">Could not load the gallery.</div>'; return; }
  render();
}

applyModeUI();
loadFeed();

let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* everything is wired now — safe to pick up a monkey handed over from the Maker */
pickupFromMaker();
</script>
